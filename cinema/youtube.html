<html>
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
<body style="margin:0px;background-color:black;overflow:hidden;">
	<div id="player" style="position:absolute;top:-150%;transform-origin: top left;scale:.01;pointer-events:none;"></div>
</body>
<script src="https://www.youtube.com/iframe_api" defer></script>
<script>
	var urlParams = new URLSearchParams(window.location.hash.slice(1));
	var old_params = window.location.hash;
	var id = urlParams.get("v");

	var player;
	var volume = parseFloat(urlParams.get("vol"));
	var seek = parseFloat(urlParams.get("seek"));

	function onYouTubeIframeAPIReady() {
		player = new YT.Player("player", {
			height: "40000%", // exploit css scale and iframe height to hide the youtube overlay
			width: "10000%",
			videoId: id,
			host: "https://www.youtube-nocookie.com",
			events: {
				"onReady": onPlayerReady
			},
			playerVars: {
				autoplay: 1,
				mute: 1, // autoplay is allowed while muted
				controls: 0,
				cc_load_policy: 0,
				disablekb: 1,
				showinfo: 0,
				modestbranding: 1,
				rel: 0,
				iv_load_policy: 3,
				//hl: urlParams.get("hl") // match country code to video to bypass autodub
			}
		});
	}

	var json = new Object();

	function onPlayerReady(event) {
		player.playVideo();
		player.setVolume(volume);
		player.seekTo(seek);
		let playeriFrame;
		for (const i of Object.keys(player)) {
			if (player[i]?.localName == "iframe") playeriFrame = player[i];
		}

		function think() {
			if (window.location.hash != old_params) {
				urlParams = new URLSearchParams(window.location.hash.slice(1));

				if (id != urlParams.get("v")) {
					id = urlParams.get("v");
					player.loadVideoById(id);
				}
				if (seek != urlParams.get("seek")) {
					seek = parseFloat(urlParams.get("seek"));
					player.seekTo(seek);
				}
				if (volume != urlParams.get("vol")) {
					volume = parseFloat(urlParams.get("vol"));
					player.setVolume(volume);
				}

				document.title = null;
			}
			old_params = window.location.hash;

			if (player.playerInfo?.progressState?.allowSeeking === false) {
				player.stopVideo(); // stopping the video skips the ad for some reason
			} else if (player.getPlayerState() == 2 || player.getPlayerState() == 5 || player.getPlayerState() == -1) {
				player.playVideo();
			}
			if (player.getPlayerState() == 1) {
				var videoAspectRatio = (player.playerInfo.videoContentRect.width / player.playerInfo.videoContentRect.height);
				var windowAspectRatio = (outerWidth / outerHeight);

				// set the youtube embed iframe height so high that the top and bottom aren't visible then adjust the video to fit in the center
				if (videoAspectRatio <= windowAspectRatio) {
					var s = (videoAspectRatio * 100) / windowAspectRatio;
				} else if (videoAspectRatio > windowAspectRatio) {
					if (videoAspectRatio > 1) videoAspectRatio = 1;
					var s = videoAspectRatio * 100;
				}
				playeriFrame.style.width = s * 100 + "%";
				if (s < 100) playeriFrame.style.left = (100 - s) / 2 + "%";
				else playeriFrame.style.left = "0%";

				json.buffered = player.getVideoLoadedFraction();
				document.title = JSON.stringify(json);
			}
		}
		setInterval(think, 50);
	}

	window.onkeydown = function(e) {
		var code = e.keyCode ? e.keyCode : e.which;
		if (volume > 0) player.unMute();

		if (code >= 240 && code <= 340) { // 0xF0
			volume = code - 240;
			player.setVolume(volume);
		}
	};

	window.onwheel = function(e) {
		seek = Math.round(e.wheelDelta * .6) / 100; // weird error of 166.66%
		json.buffered = 0;
		document.title = JSON.stringify(json);
		player.seekTo(seek);
	};
</script>
</html>
